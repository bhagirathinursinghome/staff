<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Moved</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #e0f2fe, #f0fdf4, #ede9fe);
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.92);
      padding: 45px 30px;
      text-align: center;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      animation: show 0.7s ease;
    }

    .icon {
      width: 85px;
      height: 85px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 42px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
    }

    h1 {
      color: #111827;
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .button {
      display: inline-block;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 17px;
      padding: 15px 30px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
      transition: 0.25s;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(37, 99, 235, 0.35);
    }

    .link {
      display: block;
      margin-top: 20px;
      color: #6b7280;
      font-size: 13px;
      word-break: break-all;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #9ca3af;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">↗</div>

    <h1>Page Moved</h1>

    <p>
      This page has been moved to the
      <strong>Primary App Page</strong>.
      <br>
      Please click the button below to continue.
    </p>

    <a
      class="button"
      href="https://bhagirathinursinghome.github.io/webapp/index.html"
    >
      Open Main Page →
    </a>

    <span class="link">
      bhagirathinursinghome.github.io/webapp/
    </span>

    <div class="footer">
      © Bhagirathi Nursing Home
    </div>

  </div>

</body>
</html>
